<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Огневая подготовка — тестирование</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="test-style.css">
</head>
<body>
<main class="test-main">

  <!-- ЭКРАН 1: РЕГИСТРАЦИЯ -->
  <div id="screen-reg" class="card">
    <h1 id="test-title">Тест</h1>
    <div id="test-instr" class="muted"></div>
    <hr>
    <h2>Регистрация</h2>
    <label for="fio">Фамилия Имя Отчество *</label>
    <input id="fio" type="text" maxlength="100" placeholder="Иванов Иван Иванович" autocomplete="off">
    <label for="org">Территориальный орган *</label>
    <select id="org"></select>
    <div class="row-buttons">
      <button id="btn-start">Начать тестирование</button>
      <span id="reg-error" class="bad-text"></span>
    </div>
  </div>

  <!-- ЭКРАН 2: ТЕСТ -->
  <div id="screen-test" class="card hidden">
    <div class="test-head">
      <div class="who">
        <b id="t-user"></b>
        <div class="muted" id="t-org"></div>
      </div>
      <div class="timer-box">Осталось: <span id="timer" class="timer">20:00</span></div>
    </div>
    <hr>
    <div class="counter-row">
      <span>Вопрос <b id="q-current">1</b> из <b id="q-total">20</b></span>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
    <div id="question-host"></div>
    <div id="test-error" class="bad-text"></div>
    <div class="nav-buttons">
      <button id="btn-prev" class="secondary">← Назад</button>
      <button id="btn-next">Далее →</button>
      <button id="btn-finish" class="success hidden">Завершить тест</button>
    </div>
  </div>

  <!-- ЭКРАН 3: РЕЗУЛЬТАТ -->
  <div id="screen-result" class="card hidden">
    <h1>Результат</h1>
    <div id="result-body"></div>
    <div class="row-buttons">
      <button id="btn-again">Пройти ещё раз</button>
      <button id="btn-view-results" class="secondary">Список всех результатов</button>
    </div>
  </div>

  <!-- ЭКРАН 4: СПИСОК РЕЗУЛЬТАТОВ -->
  <div id="screen-list" class="card hidden">
    <h1>Результаты тестирования</h1>
    <div class="muted small-mb">Данные хранятся локально в этом браузере (localStorage).</div>
    <div class="row-buttons">
      <button id="btn-back" class="secondary">Назад</button>
      <button id="btn-export" class="secondary">Скачать CSV</button>
      <button id="btn-clear" class="danger">Очистить всё</button>
    </div>
    <div id="results-table"></div>
  </div>

</main>

<script src="fire-test.js"></script>
<script src="test-script.js"></script>
</body>
</html>
