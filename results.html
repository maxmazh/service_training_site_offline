<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Результаты тестирования</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .results-main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .results-toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .results-toolbar input,
    .results-toolbar select {
      padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
      width: auto;
    }
    .results-toolbar input[type="text"] { min-width: 200px; }
    .results-toolbar button, .results-toolbar a {
      padding: 10px 16px; font-weight: 600; border: 0; border-radius: 6px;
      background: #2c7be5; color: #fff; cursor: pointer; text-decoration: none;
    }
    .results-toolbar button.secondary { background: #6c757d; }
    .results-toolbar a.btn-home { font-size: 13.3px; background: #2e7d32; }
    .results-toolbar button:hover { opacity: .9; }
    .results-summary { font-size: 14px; color: #555; margin-bottom: 10px; font-weight: 600; }
    .results-table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eef1f4; text-align: left; vertical-align: top; font-weight: 600; }
    th { background: #f7f9fc; position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; }
    th:hover { background: #eef2f8; }
    tr:hover td { background: #fafbfd; }
    .delete-result-btn-td { padding: 3px; }
    .ok { color: #2e7d32; font-weight: 600; }
    .bad { color: #c62828; font-weight: 600; }
    .muted { color: #888; font-weight: 600; }
    .empty { padding: 30px; text-align: center; color: #777; }
    .delete-result-btn { 
      display: block; width: 24px; height: 24px; padding: 0; border: none; border-radius: 5px;
      background: #dc3545; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; margin: 0 auto; 
    }
    .delete-result-btn:hover { background: #b02a37; }
    .results-toolbar button.danger { background: #dc3545; }
    .results-toolbar button.danger:hover { background: #b02a37; }
  </style>
</head>
<body>
<main class="results-main">

    <!-- Форма авторизации администратора -->
  <div id="login-panel" style="display:none; max-width:400px; margin:40px auto; padding:25px; background:#fff; border-radius:8px; box-shadow:0 1px 5px rgba(0,0,0,.1);">
    <h2 style="margin-bottom:20px;">Вход администратора</h2>
    <form id="login-form">
      <input
        type="email"
        id="login-email"
        placeholder="Электронная почта"
        value="maxmazh48@gmail.com"
        autocomplete="username"
        required
        style="display:block; width:100%; padding:12px; margin-bottom:12px; box-sizing:border-box;"
      >
      <input
        type="password"
        id="login-password"
        placeholder="Пароль"
        autocomplete="current-password"
        required
        style="display:block; width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box;"
      >
      <button
        type="submit"
        style="width:100%; padding:12px; background:#2c7be5; color:#fff; font-weight: 600; border:0; border-radius:6px; cursor:pointer;"
      >
        Войти
      </button>
    </form>
    <p id="login-error" style="color:#c62828; margin-top:15px;"></p>
  </div>
  <!-- Основное содержимое страницы результатов -->
  <div id="results-content" style="display:none;">

  <h1>Результаты тестирования</h1>
  <div class="results-toolbar">
    <input type="text" id="filter-text" placeholder="Поиск по ФИО или органу...">
    <select id="filter-test">
      <option value="">Все тесты</option>
    </select>
    <button id="btn-refresh" class="secondary">Обновить</button>
    <button id="btn-delete-all" class="danger">Удалить все результаты</button>
    <button id="btn-download">Скачать CSV</button>
    <a id="btn-home" class="btn-home" href="index.html">На главную</a>
    <button id="btn-logout" class="secondary" style="display:none;">Выйти</button>
    <span id="loading" class="muted"></span>
  </div>
  <div class="results-summary" id="summary"></div>
  <div class="results-table-wrap">
    <table id="results-table">
      <thead>
        <tr>
          <th data-key="date">Дата</th>
          <th data-key="test">Тест</th>
          <th data-key="fio">ФИО</th>
          <th data-key="org">Орган</th>
          <th data-key="score">Баллы</th>
          <th data-key="percent">%</th>
          <th data-key="verdict">Оценка</th>
          <th data-key="spentSec">Время</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="results-tbody"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">Нет результатов.</div>
  </div>
  </div>
</main>

<script src="firebase-sdk/firebase-app-compat.js"></script>
<script src="firebase-sdk/firebase-firestore-compat.js"></script>
<script src="firebase-sdk/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>

<script>
(function () {
  "use strict";

  var allRows = [];
  var sortKey = "date";
  var sortAsc = false;
  var dataSource = null;
  var ADMIN_EMAIL = "maxmazh48@gmail.com";

  function fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600),
        m = Math.floor((sec - h * 3600) / 60),
        s = sec % 60;
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return (h ? h + ":" : "") + p(m) + ":" + p(s);
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseRuDate(s) {
    var m = s.match(/^(\d{2})\.(\d{2})\.(\d{4}),?\s+(\d{2}):(\d{2}):(\d{2})$/);
    if (!m) return new Date(0);
    return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]);
  }


  function checkLocalServer() {
    var controller = new AbortController();

    var timeoutId = setTimeout(function () {
      controller.abort();
    }, 3000);

    return fetch("/api/health", {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    })
      .then(function (response) {
        if (!response.ok) return false;

        return response.json().then(function (data) {
          return data && data.status === "ok";
        });
      })
      .catch(function () {
        return false;
      })
      .then(function (available) {
        clearTimeout(timeoutId);
        return available;
      });
  }

  function showLogin(message) {
      document.getElementById("login-panel").style.display = "block";
      document.getElementById("results-content").style.display = "none";

      document.getElementById("btn-logout").style.display = "none";

      document.getElementById("login-error").textContent = message || "";
      document.getElementById("loading").textContent = "";
  }

  function showResults() {
      document.getElementById("login-panel").style.display = "none";
      document.getElementById("results-content").style.display = "block";
  }

  function load() {
    document.getElementById("loading").textContent = "Проверка сервера...";

    checkLocalServer().then(function (localAvailable) {

        if (localAvailable) {
            // Локальный режим — Firebase авторизация не нужна
            dataSource = "local";

            document.getElementById("login-panel").style.display = "none";
            document.getElementById("results-content").style.display = "block";
            document.getElementById("btn-logout").style.display = "none";

            loadFromLocalApi();

        } else {
            // Онлайн-режим — требуется авторизация администратора
            dataSource = "firestore";

            if (!window.auth) {
                document.getElementById("loading").textContent =
                    "Firebase Authentication не инициализирован.";
                return;
            }

            window.auth.onAuthStateChanged(function (user) {

                if (user && user.email === ADMIN_EMAIL) {
                    showResults();

                    document.getElementById("btn-logout").style.display = "inline-block";

                    loadFromFirestore();

                } else {
                    showLogin(
                        user
                            ? "У этой учётной записи нет прав администратора."
                            : ""
                    );
                }

            });
        }

    });
  }


  function loadFromLocalApi() {
    document.getElementById("loading").textContent =
      "Загрузка локальных результатов...";

    fetch("/api/results", {
      method: "GET",
      cache: "no-store"
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        return response.json();
      })
      .then(function (rows) {
        allRows = rows.map(function (r) {
          return {
            id: r.id || null,
            date: r.date || "",
            test: r.test || "",
            fio: r.fio || "",
            org: r.org || "",
            score: Number(r.score) || 0,
            total: Number(r.total) || 0,
            percent: Number(r.percent) || 0,
            verdict: r.verdict || "",
            spentSec: Number(r.spentSec) || 0,
            sourceFile: r.sourceFile || ""
          };
        });

        fillTestFilter();
        render();

        document.getElementById("loading").textContent =
          "Режим: локальный сервер";
      })
      .catch(function (error) {
        console.error("Ошибка загрузки локальных результатов:", error);

        document.getElementById("loading").textContent =
          "Не удалось загрузить результаты из локальных CSV-файлов.";

        allRows = [];
        fillTestFilter();
        render();
      });
  }

  function loadFromFirestore() {
    document.getElementById("loading").textContent =
      "Загрузка результатов из Firestore...";

    var firestore = window.db;

    if (!firestore) {
      document.getElementById("loading").textContent =
        "Firestore не инициализирован.";

      return;
    }

    var ready = window.firestoreReady || Promise.resolve();

    ready
      .then(function () {
        return firestore.collection("results")
          .orderBy("timestamp", "desc")
          .get();
      })
      .then(function (querySnapshot) {
        var rows = [];

        querySnapshot.forEach(function (doc) {
          var data = doc.data();
          var dateStr = "";

          if (data.timestamp &&
              typeof data.timestamp.toDate === "function") {
            dateStr = data.timestamp.toDate().toLocaleString("ru-RU");
          } else if (data.finishedAt) {
            dateStr = new Date(data.finishedAt).toLocaleString("ru-RU");
          }

          rows.push({
            id: doc.id,
            date: dateStr,
            test: data.testName || "",
            fio: data.fio || "",
            org: data.org || "",
            score: Number(data.score) || 0,
            total: Number(data.total) || 0,
            percent: Number(data.percent) || 0,
            verdict: data.passed ? "Уд" : "Неуд",
            spentSec: Number(data.spentSec) || 0
          });
        });

        allRows = rows;
        fillTestFilter();
        render();

        document.getElementById("loading").textContent =
          "Режим: Firestore";
      })
      .catch(function (error) {
        console.error("Ошибка загрузки Firestore:", error);

        document.getElementById("loading").textContent =
          "Не удалось загрузить результаты из Firestore.";

        allRows = [];
        fillTestFilter();
        render();
      });
  }

  function fillTestFilter() {
    var sel = document.getElementById("filter-test");
    var tests = {};
    allRows.forEach(function (r) { if (r.test) tests[r.test] = true; });
    var current = sel.value;
    sel.innerHTML = '<option value="">Все тесты</option>';
    Object.keys(tests).sort().forEach(function (t) {
      var o = document.createElement("option");
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
    sel.value = current;
  }

  function getFiltered() {
    var text = document.getElementById("filter-text").value.trim().toLowerCase();
    var test = document.getElementById("filter-test").value;
    return allRows.filter(function (r) {
      if (test && r.test !== test) return false;
      if (text) {
        var hay = (r.fio + " " + r.org).toLowerCase();
        if (hay.indexOf(text) === -1) return false;
      }
      return true;
    });
  }

  function getSorted(rows) {
    var copy = rows.slice();
    copy.sort(function (a, b) {
      var va, vb;
      if (sortKey === "date") { va = parseRuDate(a.date); vb = parseRuDate(b.date); }
      else if (sortKey === "score" || sortKey === "percent" || sortKey === "spentSec") {
        va = a[sortKey]; vb = b[sortKey];
      } else {
        va = String(a[sortKey] || "").toLowerCase();
        vb = String(b[sortKey] || "").toLowerCase();
      }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
    return copy;
  }

  function render() {
    var rows = getSorted(getFiltered());
    var tbody = document.getElementById("results-tbody");
    tbody.innerHTML = "";

    document.getElementById("summary").textContent =
      "Показано: " + rows.length + " из " + allRows.length;

    if (rows.length === 0) {
      document.getElementById("empty-msg").style.display = "block";
      return;
    }
    document.getElementById("empty-msg").style.display = "none";

    var html = "";
    rows.forEach(function (r) {
      var verdictCls = r.verdict === "Уд" ? "ok" : "bad";
      html += "<tr>" +
        "<td>" + escapeHtml(r.date) + "</td>" +
        "<td>" + escapeHtml(r.test) + "</td>" +
        "<td>" + escapeHtml(r.fio) + "</td>" +
        "<td>" + escapeHtml(r.org) + "</td>" +
        "<td>" + r.score + " / " + r.total + "</td>" +
        "<td>" + r.percent + "</td>" +
        '<td class="' + verdictCls + '">' + escapeHtml(r.verdict) + "</td>" +
        "<td>" + fmtDuration(r.spentSec) + "</td>" + 
        '<td class="delete-result-btn-td">' +
          '<button class="delete-result-btn" data-id="' +
          escapeHtml(r.id) +
          '" title="Удалить результат">×</button>' +
        '</td>' +
      "</tr>";
    });
    tbody.innerHTML = html;
  }

  function deleteResult(id) {
    var result = allRows.find(function (r) {
        return r.id === id;
    });

    if (!result) {
        alert("Результат не найден.");
        return;
    }

    var confirmed = confirm(
        "Удалить результат?\n\n" +
        "ФИО: " + result.fio + "\n" +
        "Тест: " + result.test + "\n" +
        "Баллы: " + result.score + " / " + result.total
    );

    if (!confirmed) return;

    document.getElementById("loading").textContent = "Удаление...";

    var deletePromise;

    if (dataSource === "local") {
        // Удаление записи из локального CSV
        deletePromise = fetch(
            "/api/results/" + encodeURIComponent(id),
            {
                method: "DELETE"
            }
        ).then(function (response) {
            if (!response.ok) {
                throw new Error("Ошибка HTTP: " + response.status);
            }

            return response.json();
        });

    } else if (dataSource === "firestore") {
        // Удаление документа из Firestore
        deletePromise = window.db
            .collection("results")
            .doc(id)
            .delete();

    } else {
        alert("Не удалось определить источник данных.");
        return;
    }

    deletePromise
        .then(function () {
            // Удаляем запись из массива
            allRows = allRows.filter(function (r) {
                return r.id !== id;
            });

            fillTestFilter();
            render();

            document.getElementById("loading").textContent =
                "Результат успешно удалён.";

            console.log("Результат удалён:", id);
        })
        .catch(function (error) {
            console.error("Ошибка удаления результата:", error);

            document.getElementById("loading").textContent =
                "Не удалось удалить результат.";

            alert(
                "Ошибка удаления результата. " +
                "Проверь подключение и доступность сервера."
            );
        });
  }

  function deleteAllResults() {
    var confirmed = confirm(
        "ВНИМАНИЕ!\n\n" +
        "Ты действительно хочешь удалить ВСЕ результаты тестирования?\n\n" +
        "Это действие нельзя отменить."
    );

    if (!confirmed) return;

    var button = document.getElementById("btn-delete-all");

    button.disabled = true;

    document.getElementById("loading").textContent =
        "Удаление всех результатов...";

    var deletePromise;

    if (dataSource === "local") {
        // Удаление всех локальных CSV-файлов
        deletePromise = fetch("/api/results", {
            method: "DELETE"
        }).then(function (response) {
            if (!response.ok) {
                throw new Error("Ошибка HTTP: " + response.status);
            }

            return response.json();
        });

    } else if (dataSource === "firestore") {
        // Удаление всех документов Firestore
        deletePromise = window.db
            .collection("results")
            .get()
            .then(function (snapshot) {
                if (snapshot.empty) {
                    return { deleted: 0 };
                }

                var docs = snapshot.docs;
                var deletePromise = Promise.resolve();

                // Firestore позволяет удалить до 500 документов за batch
                for (var i = 0; i < docs.length; i += 500) {
                    (function (batchDocs) {
                        deletePromise = deletePromise.then(function () {
                            var batch = window.db.batch();

                            batchDocs.forEach(function (doc) {
                                batch.delete(doc.ref);
                            });

                            return batch.commit();
                        });
                    })(docs.slice(i, i + 500));
                }

                return deletePromise.then(function () {
                    return { deleted: docs.length };
                });
            });

    } else {
        button.disabled = false;

        document.getElementById("loading").textContent =
            "Не удалось определить источник данных.";

        return;
    }

    deletePromise
        .then(function (result) {
            allRows = [];

            fillTestFilter();
            render();

            document.getElementById("loading").textContent =
                "Все результаты успешно удалены.";

            console.log("Удаление завершено:", result);
        })
        .catch(function (error) {
            console.error("Ошибка удаления результатов:", error);

            document.getElementById("loading").textContent =
                "Не удалось удалить все результаты.";

            alert(
                "Произошла ошибка при удалении результатов. " +
                "Проверь подключение и права доступа."
            );
        })
        .finally(function () {
            button.disabled = false;
        });
  }

  function downloadCSV() {
      // Получаем отфильтрованные и отсортированные результаты
      var rows = getSorted(getFiltered());

      if (rows.length === 0) {
          alert("Нет результатов для скачивания.");
          return;
      }
      // Заголовки столбцов
      var headers = [
          "Дата",
          "Тест",
          "ФИО",
          "Орган",
          "Баллы",
          "Всего баллов",
          "Процент",
          "Оценка",
          "Время"
      ];

      // Защита значений для CSV
      function escapeCSV(value) {
          var text = String(value == null ? "" : value);

          // Защита от формул при открытии CSV в Excel
          if (/^[\s]*[=+\-@]/.test(text)) {
              text = "'" + text;
          }

          // Экранируем кавычки
          return '"' + text.replace(/"/g, '""') + '"';
      }

      var csvRows = [headers.map(escapeCSV).join(";")];

      rows.forEach(function (r) {
          var row = [
              r.date,
              r.test,
              r.fio,
              r.org,
              r.score,
              r.total,
              r.percent + "%",
              r.verdict,
              fmtDuration(r.spentSec)
          ];

          csvRows.push(row.map(escapeCSV).join(";"));
      });

      // BOM помогает Excel правильно распознавать UTF-8
      var csvContent = "\uFEFF" + csvRows.join("\r\n");

      var blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;"
      });

      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");

      link.href = url;
      link.download = "results_" +
          new Date().toISOString().slice(0, 10) + ".csv";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
  }

  document.getElementById("results-tbody")
    .addEventListener("click", function (event) {

        var button = event.target.closest(".delete-result-btn");

        if (!button) return;

        var id = button.getAttribute("data-id");

        deleteResult(id);
    });

  // Сортировка по клику на заголовок
  document.querySelectorAll("#results-table th").forEach(function (th) {
    th.addEventListener("click", function () {
      var key = th.getAttribute("data-key");
      if (sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = true; }
      render();
    });
  });

  // Авторизация администратора
  document.getElementById("login-form").addEventListener("submit", function (event) {
    event.preventDefault();

    var email = document.getElementById("login-email").value.trim();
    var password = document.getElementById("login-password").value;

    var errorNode = document.getElementById("login-error");
    var submitButton = this.querySelector('button[type="submit"]');

    errorNode.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = "Вход...";

    window.auth.signInWithEmailAndPassword(email, password)
        .then(function (credential) {

            if (credential.user.email !== ADMIN_EMAIL) {
                return window.auth.signOut().then(function () {
                    throw new Error("У этой учётной записи нет прав администратора.");
                });
            }

        })
        .catch(function (error) {

            console.error("Ошибка авторизации:", error);

            if (error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password" ||
                error.code === "auth/user-not-found") {

                errorNode.textContent = "Неверная электронная почта или пароль.";

            } else {
                errorNode.textContent = error.message;
            }

        })
        .finally(function () {
            submitButton.disabled = false;
            submitButton.textContent = "Войти";
        });
  });

  // Выход администратора
  document.getElementById("btn-logout").addEventListener("click", function () {
    window.auth.signOut()
        .then(function () {
            allRows = [];
            fillTestFilter();
            render();
        })
        .catch(function (error) {
            console.error("Ошибка выхода:", error);
            alert("Не удалось выйти из учётной записи.");
        });
  });

  document.getElementById("btn-delete-all").addEventListener("click", deleteAllResults);
  document.getElementById("filter-text").addEventListener("input", render);
  document.getElementById("filter-test").addEventListener("change", render);
  document.getElementById("btn-refresh").addEventListener("click", function () {
    // Сбрасываем фильтры
    document.getElementById("filter-text").value = "";
    document.getElementById("filter-test").value = "";
    // Обновляем данные в зависимости от режима
    if (dataSource === "local") {
        loadFromLocalApi();
    } else if (dataSource === "firestore" && window.auth.currentUser) {
        loadFromFirestore();
    }
  });
  document.getElementById("btn-download").addEventListener("click", downloadCSV)

  load();
})();
</script>
</body>
</html>
